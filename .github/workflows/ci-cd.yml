name: PERN DevOps CI/CD

on:
  push:
    branches:
      - devops-pipeline

  pull_request:
    branches:
      - devops-pipeline

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # JOB 1: BUILD AND VALIDATE APPLICATION
  # ============================================================

  build-and-test:
    runs-on: ubuntu-latest

    steps:

      # Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Match the Node version used by the application Dockerfiles
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install React/frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./PERN-stack Application/Client
        run: npm install

      # Confirm React can create a production build
      - name: Build frontend
        working-directory: ./PERN-stack Application/Client
        env:
          REACT_APP_BACKEND_BASE_URL: http://localhost:5000
        run: npm run build

      # Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./PERN-stack Application/Server
        run: npm install

      # Validate docker-compose.yml syntax and variable substitution
      - name: Validate Docker Compose
        working-directory: ./PERN-stack Application
        env:
          POSTGRES_USER: pernuser
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: perndb
        run: docker compose config

      # Verify Docker can build the application images
      - name: Build Docker images
        working-directory: ./PERN-stack Application
        env:
          POSTGRES_USER: pernuser
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: perndb
        run: docker compose build


  # ============================================================
  # JOB 2: BUILD, SECURITY SCAN, AND PUSH DOCKER IMAGES
  # ============================================================

  push-images:
    runs-on: ubuntu-latest

    # Do not run this job unless build-and-test passed
    needs: build-and-test

    # Only publish images for an actual push.
    # Pull requests will run CI but will not publish containers.
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:

      # Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # BUILD BACKEND IMAGE
      # ----------------------------------------------------------

      - name: Build backend Docker image
        run: |
          docker build \
            -t ghcr.io/armond107rah/pern-backend:${{ github.sha }} \
            "PERN-stack Application/Server"


      # ----------------------------------------------------------
      # SECURITY SCAN BACKEND WITH TRIVY
      # ----------------------------------------------------------

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/armond107rah/pern-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH


      # ----------------------------------------------------------
      # BUILD FRONTEND IMAGE
      # ----------------------------------------------------------

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ghcr.io/armond107rah/pern-frontend:${{ github.sha }} \
            "PERN-stack Application/Client"


      # ----------------------------------------------------------
      # SECURITY SCAN FRONTEND WITH TRIVY
      # ----------------------------------------------------------

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/armond107rah/pern-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH


      # ----------------------------------------------------------
      # LOGIN TO GITHUB CONTAINER REGISTRY
      # ----------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------------------------
      # TAG IMAGES AS LATEST
      # ----------------------------------------------------------

      - name: Tag backend image as latest
        run: |
          docker tag \
            ghcr.io/armond107rah/pern-backend:${{ github.sha }} \
            ghcr.io/armond107rah/pern-backend:latest

      - name: Tag frontend image as latest
        run: |
          docker tag \
            ghcr.io/armond107rah/pern-frontend:${{ github.sha }} \
            ghcr.io/armond107rah/pern-frontend:latest


      # ----------------------------------------------------------
      # PUSH BACKEND IMAGE
      # ----------------------------------------------------------

      - name: Push backend Docker images
        run: |
          docker push ghcr.io/armond107rah/pern-backend:${{ github.sha }}
          docker push ghcr.io/armond107rah/pern-backend:latest


      # ----------------------------------------------------------
      # PUSH FRONTEND IMAGE
      # ----------------------------------------------------------

      - name: Push frontend Docker images
        run: |
          docker push ghcr.io/armond107rah/pern-frontend:${{ github.sha }}
          docker push ghcr.io/armond107rah/pern-frontend:latest
