name: PERN DevOps CI/CD

on:
  push:
    branches:
      - devops-pipeline

  pull_request:
    branches:
      - devops-pipeline

permissions:
  contents: read
  packages: write

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: ./PERN-stack Application/Client
        run: npm install

      - name: Build frontend
        working-directory: ./PERN-stack Application/Client
        env:
          REACT_APP_BACKEND_BASE_URL: http://localhost:5000
        run: npm run build

      - name: Install backend dependencies
        working-directory: ./PERN-stack Application/Server
        run: npm install

      - name: Validate Docker Compose
        working-directory: ./PERN-stack Application
        env:
          POSTGRES_USER: pernuser
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: perndb
        run: docker compose config

      - name: Build Docker images
        working-directory: ./PERN-stack Application
        env:
          POSTGRES_USER: pernuser
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: perndb
        run: docker compose build

  push-images:
    runs-on: ubuntu-latest
    needs: build-and-test

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./PERN-stack Application/Server
          push: true
          tags: |
            ghcr.io/armond107rah/pern-backend:latest
            ghcr.io/armond107rah/pern-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./PERN-stack Application/Client
          push: true
          tags: |
            ghcr.io/armond107rah/pern-frontend:latest
            ghcr.io/armond107rah/pern-frontend:${{ github.sha }}
